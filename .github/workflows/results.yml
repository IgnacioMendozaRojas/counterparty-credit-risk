name: Results

# Runs the example portfolio and the sensitivity analysis (10,000 paths each) and commits
# the tables and figures in docs/. On demand, and whenever the engine or examples change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "examples/**"]

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: true

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -e .
      - run: python examples/portfolio.py
      - run: python examples/sensitivities.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -qm "Results: portfolio and sensitivities"
          git pull -q --rebase && git push
