[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counterparty-credit-risk"
version = "0.1.0"
description = "Monte Carlo counterparty credit risk: EE, PFE, EEPE and CVA/DVA for netting sets with collateral"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ignacio Mendoza Rojas" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "scipy>=1.11", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ccr/models.py" = ["N802"]
